<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayfair Inspired Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo">Wayfair</div>
    <nav>
        <ul>
            <li><a href="#">Furniture</a></li>
            <li><a href="#">Decor</a></li>
            <li><a href="#">Outdoor</a></li>
            <li><a href="#">Sale</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<!-- HERO SLIDER -->
<section class="hero-slider">
    <div class="slide active" style="background-image:url('https://via.placeholder.com/1600x600?text=Slide+1');"></div>
    <div class="slide" style="background-image:url('https://via.placeholder.com/1600x600?text=Slide+2');"></div>
    <div class="slide" style="background-image:url('https://via.placeholder.com/1600x600?text=Slide+3');"></div>
</section>

<!-- CATEGORIES -->
<section class="categories">
    <div class="card">Living Room</div>
    <div class="card">Bedroom</div>
    <div class="card">Kitchen</div>
    <div class="card">Outdoor</div>
</section>

<!-- FOOTER -->
<footer>
    <p>&copy; 2025 Wayfair Inspired Prototype</p>
</footer>

<script src="script.js"></script>
</body>
</html>
